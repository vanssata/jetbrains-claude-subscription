# Build against the locally installed IDE instead of downloading ~1 GB of platform.
# Point this at any 2026.2 JetBrains IDE; the plugin only needs the AI Assistant
# (com.intellij.ml.llm) plugin that ships bundled with it.
platformLocalPath=/home/vanssa/.local/share/JetBrains/Toolbox/apps/phpstorm

# JetBrains AI Assistant, which plugin.xml declares as a dependency. It is not
# bundled in the IDE installation — it lives under the IDE's config directory and updates
# independently of the IDE build.
aiAssistantPluginPath=/home/vanssa/.local/share/JetBrains/PhpStorm2026.2/ml-llm

# The platform already provides the Kotlin stdlib — bundling a second copy in the
# plugin jar causes classloader conflicts at runtime.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true
